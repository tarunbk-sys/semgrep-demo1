rules:
  - id: demo-hardcoded-secret
    message: Hardcoded credential assigned to a variable. Load it from the environment or a secrets manager.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern: $VAR = "..."
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i).*(secret|password|passwd|api_?key|access_?key).*

  - id: demo-hardcoded-db-password
    message: Hardcoded database password in connection options.
    severity: ERROR
    languages: [javascript]
    pattern: "{..., password: \"...\", ...}"

  - id: demo-os-command-concat
    message: Shell command built by string concatenation. This allows command injection.
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: os.system($A + $B)
      - pattern: os.popen($A + $B)

  - id: demo-insecure-random
    message: "`random` is not cryptographically secure. Use the `secrets` module for tokens."
    severity: WARNING
    languages: [python]
    pattern-either:
      - pattern: random.random()
      - pattern: random.choice(...)
      - pattern: random.randint(...)

  - id: demo-path-traversal-open
    message: File path built from a concatenated string. Validate the path or use a safe join.
    severity: ERROR
    languages: [python]
    pattern: open("..." + $X, ...)

  - id: demo-js-sql-injection
    message: SQL query built from a template string or concatenation. Use placeholders.
    severity: ERROR
    languages: [javascript]
    pattern-either:
      - pattern: $DB.query(`...${$X}...`, ...)
      - pattern: $DB.query("..." + $X, ...)
